<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Marmita do Engenheiro</title>
<link rel="icon" type="image/png" href="{{ url_for('static', filename='icon-black.png') }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #101012;
    --brand: #F5A623;
    --brand-dark: #d98e12;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', 'Segoe UI', sans-serif;
    background:
      radial-gradient(circle at 20% 15%, rgba(245,166,35,.16), transparent 55%),
      radial-gradient(circle at 85% 85%, rgba(245,166,35,.10), transparent 50%),
      var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .box {
    background: white;
    border-radius: 20px;
    padding: 44px 40px 36px;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 24px 70px rgba(0,0,0,.45);
    text-align: center;
  }
  .box img { width: 128px; height: auto; margin-bottom: 8px; }
  p.subtitle { font-size: .85rem; color: #8a8a90; margin-bottom: 30px; letter-spacing: .3px; }

  label { display: block; text-align: left; font-family: 'Poppins', sans-serif; font-size: .78rem; font-weight: 600; color: #4a4a50; margin-bottom: 6px; letter-spacing: .3px; }
  input {
    width: 100%; padding: 12px 14px;
    border: 1.5px solid #e4e4e2; border-radius: 10px;
    font-family: 'Inter', sans-serif;
    font-size: .95rem; margin-bottom: 18px;
    transition: border-color .2s, box-shadow .2s;
    background: #fafaf9;
  }
  input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 4px rgba(245,166,35,.18); background: #fff; }

  button {
    width: 100%; padding: 13px;
    background: var(--brand); color: var(--ink);
    border: none; border-radius: 10px;
    font-family: 'Poppins', sans-serif;
    font-size: 1rem; font-weight: 700;
    cursor: pointer; margin-top: 4px;
    transition: background .18s, transform .18s;
  }
  button:hover { background: var(--brand-dark); transform: translateY(-1px); }

  .erro {
    background: #f8d7da; color: #721c24;
    padding: 10px 14px; border-radius: 10px;
    font-size: .85rem; margin-bottom: 20px;
  }
</style>
</head>
<body>
  <div class="box">
    <img src="{{ url_for('static', filename='logo-full-light.png') }}" alt="Marmita do Engenheiro">
    <p class="subtitle">Painel financeiro</p>

    {% if erro %}
      <div class="erro">{{ erro }}</div>
    {% endif %}

    <form method="post">
      <label>Usuário</label>
      <input type="text" name="usuario" autofocus autocomplete="username">
      <label>Senha</label>
      <input type="password" name="senha" autocomplete="current-password">
      <button type="submit">Entrar</button>
    </form>
  </div>
</body>
</html>
