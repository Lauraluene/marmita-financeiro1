<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Marmita do Engenheiro{% endblock %}</title>
<link rel="icon" type="image/png" href="{{ url_for('static', filename='icon-black.png') }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #101012;
    --ink-soft: #1c1c20;
    --brand: #F5A623;
    --brand-dark: #d98e12;
    --brand-tint: #fff4de;
    --bg: #f7f7f5;
    --paper: #ffffff;
    --text: #17171a;
    --muted: #7a7a82;
    --border: #ececea;
    --green: #2d6a4f;
    --red: #c1121f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); }
  h1, h2, h3, .brand-word { font-family: 'Poppins', 'Inter', sans-serif; }

  header {
    background: var(--ink);
    color: white;
    padding: 14px 32px;
    display: flex;
    align-items: center;
    gap: 14px;
    position: sticky;
    top: 0;
    z-index: 20;
    box-shadow: 0 2px 12px rgba(0,0,0,.15);
  }
  header .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
  header .brand img { height: 34px; width: auto; display: block; }
  header .brand-text { display: flex; flex-direction: column; line-height: 1.1; }
  header .brand-word { font-size: 1rem; font-weight: 700; color: #fff; letter-spacing: .3px; }
  header .brand-sub { font-size: .62rem; font-weight: 600; color: var(--brand); letter-spacing: 1.6px; text-transform: uppercase; }
  header nav { margin-left: auto; display: flex; gap: 4px; align-items: center; }
  header nav a {
    color: #b8b8bd;
    text-decoration: none;
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 0.85rem;
    font-weight: 500;
    transition: all .18s ease;
  }
  header nav a:hover { color: white; background: rgba(255,255,255,.08); }
  header nav a.active { color: var(--ink); background: var(--brand); font-weight: 600; }
  header nav a.logout { color: #e07a7a; }
  header nav a.logout:hover { color: #fff; background: rgba(224,122,122,.18); }

  .container { max-width: 1100px; margin: 28px auto; padding: 0 24px; }

  .card {
    background: var(--paper);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 24px;
    box-shadow: 0 4px 20px rgba(16,16,18,.06);
    border: 1px solid var(--border);
  }
  .card h2 { font-size: 1rem; font-weight: 600; margin-bottom: 16px; color: var(--text); }

  .btn {
    display: inline-block;
    padding: 10px 22px;
    border-radius: 10px;
    font-size: 0.88rem;
    font-weight: 600;
    cursor: pointer;
    border: none;
    text-decoration: none;
    transition: all .18s ease;
  }
  .btn:hover { transform: translateY(-1px); }
  .btn-primary   { background: var(--brand); color: var(--ink); box-shadow: 0 3px 10px rgba(245,166,35,.35); }
  .btn-primary:hover { background: var(--brand-dark); }
  .btn-secondary { background: #f0f0ee; color: #333; }
  .btn-secondary:hover { background: #e6e6e3; }
  .btn-danger    { background: #fff0f0; color: var(--red); border: 1px solid #f5c6cb; padding: 4px 10px; font-size: .78rem; }

  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 0.75rem;
    font-weight: 600;
  }
  .badge-auto       { background: #d4edda; color: #155724; }
  .badge-pendente   { background: var(--brand-tint); color: #935e00; }
  .badge-ignorado   { background: #e2e3e5; color: #6c757d; }
  .badge-confirmado { background: #cce5ff; color: #004085; }

  .alert { padding: 12px 18px; border-radius: 10px; margin-bottom: 16px; font-size: .9rem; }
  .alert-erro    { background: #f8d7da; color: #721c24; }
  .alert-success { background: #d4edda; color: #155724; }

  table { width: 100%; border-collapse: collapse; font-size: 0.87rem; }
  th { background: #faf9f7; padding: 10px 12px; text-align: left; font-weight: 600; color: #555; border-bottom: 2px solid var(--border); }
  td { padding: 8px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr:hover td { background: #fafafa; }

  .valor-saida  { color: var(--red); font-weight: 600; font-variant-numeric: tabular-nums; }
  .valor-entrada{ color: var(--green); font-weight: 600; font-variant-numeric: tabular-nums; }
  .valor-neg    { color: var(--red); }
  .valor-pos    { color: var(--green); }
</style>
{% block extra_head %}{% endblock %}
</head>
<body>
<header>
  <a href="/" class="brand">
    <img src="{{ url_for('static', filename='icon-white.png') }}" alt="Marmita do Engenheiro">
    <div class="brand-text">
      <span class="brand-word">MARMITA</span>
      <span class="brand-sub">do engenheiro</span>
    </div>
  </a>
  <nav>
    <a href="/" {% if request.endpoint == 'index' %}class="active"{% endif %}>Início</a>
    <a href="/historico" {% if request.endpoint == 'historico' %}class="active"{% endif %}>Comparativo</a>
    <a href="/memoria" {% if request.endpoint == 'memoria' %}class="active"{% endif %}>Memória</a>
    <a href="/logout" class="logout">Sair</a>
  </nav>
</header>

{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    <div class="container">
      {% for cat, msg in messages %}
        <div class="alert alert-{{ cat }}">{{ msg }}</div>
      {% endfor %}
    </div>
  {% endif %}
{% endwith %}

{% block content %}{% endblock %}
</body>
</html>
