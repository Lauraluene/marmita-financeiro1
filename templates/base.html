<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Marmita do Engenheiro{% endblock %}</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: #f5f5f5; color: #222; }

  header {
    background: #1a1a2e;
    color: white;
    padding: 14px 32px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  header h1 { font-size: 1.1rem; font-weight: 600; }
  header nav { margin-left: auto; display: flex; gap: 4px; }
  header nav a {
    color: #aaa;
    text-decoration: none;
    padding: 6px 14px;
    border-radius: 6px;
    font-size: 0.85rem;
    transition: all .15s;
  }
  header nav a:hover { color: white; background: rgba(255,255,255,.08); }
  header nav a.active { color: white; background: rgba(255,255,255,.12); }

  .container { max-width: 1100px; margin: 28px auto; padding: 0 24px; }

  .card {
    background: white;
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 24px;
    box-shadow: 0 2px 8px rgba(0,0,0,.07);
  }
  .card h2 { font-size: 1rem; font-weight: 600; margin-bottom: 16px; color: #444; }

  .btn {
    display: inline-block;
    padding: 9px 20px;
    border-radius: 8px;
    font-size: 0.88rem;
    font-weight: 600;
    cursor: pointer;
    border: none;
    text-decoration: none;
    transition: opacity .15s;
  }
  .btn:hover { opacity: .85; }
  .btn-primary   { background: #e63946; color: white; }
  .btn-secondary { background: #eee; color: #333; }
  .btn-danger    { background: #fff0f0; color: #c1121f; border: 1px solid #f5c6cb; padding: 4px 10px; font-size: .78rem; }

  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 0.75rem;
    font-weight: 600;
  }
  .badge-auto       { background: #d4edda; color: #155724; }
  .badge-pendente   { background: #fff3cd; color: #856404; }
  .badge-ignorado   { background: #e2e3e5; color: #6c757d; }
  .badge-confirmado { background: #cce5ff; color: #004085; }

  .alert { padding: 12px 18px; border-radius: 8px; margin-bottom: 16px; font-size: .9rem; }
  .alert-erro    { background: #f8d7da; color: #721c24; }
  .alert-success { background: #d4edda; color: #155724; }

  table { width: 100%; border-collapse: collapse; font-size: 0.87rem; }
  th { background: #f8f8f8; padding: 10px 12px; text-align: left; font-weight: 600; color: #555; border-bottom: 2px solid #eee; }
  td { padding: 8px 12px; border-bottom: 1px solid #f0f0f0; vertical-align: middle; }
  tr:hover td { background: #fafafa; }

  .valor-saida  { color: #c1121f; font-weight: 600; font-variant-numeric: tabular-nums; }
  .valor-entrada{ color: #2d6a4f; font-weight: 600; font-variant-numeric: tabular-nums; }
  .valor-neg    { color: #c1121f; }
  .valor-pos    { color: #2d6a4f; }
</style>
{% block extra_head %}{% endblock %}
</head>
<body>
<header>
  <div style="font-size:1.5rem">🍱</div>
  <h1>Marmita do Engenheiro</h1>
  <nav>
    <a href="/" {% if request.endpoint == 'index' %}class="active"{% endif %}>Início</a>
    <a href="/historico" {% if request.endpoint == 'historico' %}class="active"{% endif %}>Comparativo</a>
    <a href="/memoria" {% if request.endpoint == 'memoria' %}class="active"{% endif %}>Memória</a>
    <a href="/logout" style="color:#e63946">Sair</a>
  </nav>
</header>

{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    <div class="container">
      {% for cat, msg in messages %}
        <div class="alert alert-{{ cat }}">{{ msg }}</div>
      {% endfor %}
    </div>
  {% endif %}
{% endwith %}

{% block content %}{% endblock %}
</body>
</html>
